<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WAVE BEATZ — Admin Login</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(208,166,83,0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(255,255,255,0.025),
                    transparent 35%
                ),
                #080808;

            color: #f5f5f5;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-mark {
            width: 58px;
            height: 58px;

            margin: 0 auto 15px;

            border-radius: 50%;

            border: 1px solid #d0a653;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #d0a653;

            font-size: 17px;
            font-weight: 800;

            letter-spacing: 1px;

            box-shadow:
                0 0 30px rgba(208,166,83,0.08);
        }

        .brand strong {
            display: block;

            font-size: 18px;

            letter-spacing: 3px;
        }

        .brand span {
            display: block;

            margin-top: 6px;

            color: #777;

            font-size: 11px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .panel {
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.05),
                    rgba(255,255,255,0.018)
                );

            border: 1px solid rgba(255,255,255,0.09);

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 25px 80px rgba(0,0,0,0.45);
        }

        h1 {
            font-size: 25px;

            margin-bottom: 8px;
        }

        .description {
            color: #777;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 26px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #d8d8d8;

            font-size: 13px;

            font-weight: 600;
        }

        input {
            width: 100%;

            height: 50px;

            padding: 0 14px;

            border-radius: 9px;

            border: 1px solid rgba(255,255,255,0.10);

            background: #101010;

            color: #fff;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #d0a653;

            box-shadow:
                0 0 0 2px rgba(208,166,83,0.08);
        }

        .error {
            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 9px;

            border: 1px solid rgba(255,80,80,0.25);

            background: rgba(255,60,60,0.07);

            color: #ff9999;

            font-size: 13px;

            line-height: 1.5;
        }

        button {
            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: 0;

            border-radius: 9px;

            background: #d0a653;

            color: #080808;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 0.4px;

            cursor: pointer;

            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);

            filter: brightness(1.08);
        }

        .back {
            display: block;

            margin-top: 22px;

            text-align: center;

            color: #777;

            font-size: 12px;
        }

        .back:hover {
            color: #d0a653;
        }

        .security {
            margin-top: 20px;

            text-align: center;

            color: #555;

            font-size: 10px;

            letter-spacing: 0.5px;
        }

    </style>

</head>

<body>

    <div class="login-wrapper">

        <div class="brand">

            <div class="brand-mark">
                WB
            </div>

            <strong>
                WAVE BEATZ
            </strong>

            <span>
                DJ WAVY · Admin
            </span>

        </div>

        <div class="panel">

            <h1>
                Admin Login
            </h1>

            <p class="description">
                Sign in to manage beats, uploads and
                WAVE BEATZ administration.
            </p>

            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}

            <form
                method="POST"
                action="/admin/login"
                autocomplete="off"
            >

                <div class="field">

                    <label for="username">
                        Admin Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>

                <div class="field">

                    <label for="password">
                        Admin Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button type="submit">
                    ENTER ADMIN
                </button>

            </form>

            <a
                class="back"
                href="/"
            >
                ← Back to WAVE BEATZ
            </a>

        </div>

        <div class="security">
            PRIVATE ADMIN AREA
        </div>

    </div>

</body>
</html>
