<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Beat Not Found — WAVE BEATZ</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/beat.css') }}"
    >

</head>

<body>

    <header class="beat-nav">

        <div class="nav-inner">

            <a
                href="/"
                class="brand"
            >
                <span class="brand-main">
                    WAVE
                </span>

                <span class="brand-accent">
                    BEATZ
                </span>
            </a>

        </div>

    </header>


    <main>

        <section
            class="beat-hero"
            style="min-height: 70vh; display: flex; align-items: center;"
        >

            <div
                class="section-inner"
                style="text-align: center;"
            >

                <div class="section-label">
                    WAVE BEATZ
                </div>

                <h1
                    style="
                        font-size: clamp(42px, 8vw, 80px);
                        margin-bottom: 20px;
                    "
                >
                    BEAT NOT FOUND.
                </h1>

                <p
                    style="
                        color: #888;
                        max-width: 500px;
                        margin: 0 auto 30px;
                    "
                >
                    This beat may have been removed
                    or the link may be incorrect.
                </p>

                <a
                    href="/"
                    class="download-button"
                    style="
                        display: inline-flex;
                        width: auto;
                        padding: 15px 25px;
                    "
                >
                    ← BACK TO WAVE BEATZ
                </a>

            </div>

        </section>

    </main>

</body>
</html>
